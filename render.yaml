services:
  - type: web
    name: truthlens-ai
    runtime: python
    buildCommand: pip install -r requirements.txt && python bootstrap_model.py
    startCommand: gunicorn app:app --workers 2 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
    disk:
      name: data
      mountPath: /opt/render/project/src/instance
      sizeGB: 1
