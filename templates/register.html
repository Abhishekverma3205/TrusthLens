<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — TruthLens AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
<div class="blob one"></div>
<div class="blob two"></div>

<div class="login-card">
  <div class="brand">🧠 TruthLens AI</div>
  <h2>Create Account</h2>
  <p>Join TruthLens AI today</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} py-2 mb-3" style="border-radius:12px;font-size:14px;">{{ msg }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST" action="{{ url_for('register') }}">
    <input type="text" name="full_name" placeholder="Full Name" required>
    <input type="text" name="username" placeholder="Username" required autocomplete="username">
    <input type="email" name="email" placeholder="Email Address" required>
    <div class="password-box">
      <input type="password" name="password" id="password" placeholder="Password (min 8 chars)" required minlength="8">
      <i class="bx bx-show" id="togglePassword"></i>
    </div>
    <div class="strength"><div id="strengthBar"></div></div>
    <div id="strengthLabel" style="font-size:12px;color:#94a3b8;margin-top:-8px;"></div>
    <button type="submit">Create Account</button>
    <a href="{{ url_for('login') }}">Already have an account? Login</a>
  </form>
</div>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
